<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check User Role</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0f172a;
            color: #e2e8f0;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #334155;
        }
        h1 {
            color: #fbbf24;
            margin-bottom: 20px;
        }
        .info {
            background: #334155;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .label {
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .value {
            color: #fbbf24;
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            background: #2563eb;
        }
        .error {
            background: #dc2626;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Check Current User Role</h1>
        <div id="result">
            <p style="text-align: center; color: #94a3b8;">Click the button to check your current user role...</p>
        </div>
        <button onclick="checkUser()">Check My Role</button>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCERFgJcwl0gHFQXhTPMavt26q0RaKDHF8",
            authDomain: "eaguedemo.firebaseapp.com",
            projectId: "eaguedemo",
            storageBucket: "eaguedemo.firebasestorage.app",
            messagingSenderId: "811342007569",
            appId: "1:811342007569:web:c1b78c0c5b336f989450b0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.checkUser = async function() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p style="text-align: center; color: #94a3b8;">Checking...</p>';

            try {
                const user = auth.currentUser;
                
                if (!user) {
                    resultDiv.innerHTML = '<div class="error">❌ No user logged in. Please log in first at <a href="http://localhost:3000/login" style="color: #fbbf24;">localhost:3000/login</a></div>';
                    return;
                }

                // Get user document from Firestore
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                
                if (!userDoc.exists()) {
                    resultDiv.innerHTML = '<div class="error">❌ User document not found in Firestore</div>';
                    return;
                }

                const userData = userDoc.data();
                
                resultDiv.innerHTML = `
                    <div class="info">
                        <div class="label">Email</div>
                        <div class="value">${user.email}</div>
                    </div>
                    <div class="info">
                        <div class="label">User ID</div>
                        <div class="value">${user.uid}</div>
                    </div>
                    <div class="info">
                        <div class="label">Current Role</div>
                        <div class="value">${userData.role || 'No role assigned'}</div>
                    </div>
                    <div class="info">
                        <div class="label">Display Name</div>
                        <div class="value">${userData.displayName || 'N/A'}</div>
                    </div>
                    ${userData.seasonId ? `
                    <div class="info">
                        <div class="label">Season ID (Committee)</div>
                        <div class="value">${userData.seasonId}</div>
                    </div>
                    ` : ''}
                    ${userData.teamId ? `
                    <div class="info">
                        <div class="label">Team ID</div>
                        <div class="value">${userData.teamId}</div>
                    </div>
                    ` : ''}
                    <div class="info" style="margin-top: 20px; ${userData.role === 'committee_admin' ? 'background: #059669;' : userData.role === 'super_admin' ? 'background: #7c3aed;' : 'background: #dc2626;'}">
                        <div class="label" style="color: white;">Access Status</div>
                        <div class="value" style="color: white;">
                            ${userData.role === 'committee_admin' ? '✅ HAS COMMITTEE ACCESS' : 
                              userData.role === 'super_admin' ? '✅ HAS SUPER ADMIN ACCESS' : 
                              '❌ NO COMMITTEE ACCESS'}
                        </div>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                console.error('Error checking user:', error);
            }
        };

        // Auto-check on page load
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log('User detected:', user.email);
            } else {
                document.getElementById('result').innerHTML = '<div class="error">❌ No user logged in. Please log in first at <a href="http://localhost:3000/login" style="color: #fbbf24;">localhost:3000/login</a></div>';
            }
        });
    </script>
</body>
</html>
